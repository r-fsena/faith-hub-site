    <!-- Dados Estruturados (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Faith Hub",
      "url": "https://faithhubs.com",
      "logo": "https://faithhubs.com/brand/logo-transparent.png",
      "email": "contato@faithhub.com.br"
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Faith Hub",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android (PWA)",
      "description": "Sistema de gestão para igrejas com app de membros, Bíblia offline, check-in Kids, dízimo via PIX e gestão multi-campus."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como os membros instalam o aplicativo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O app é uma Progressive Web App (PWA) de última geração. O membro acessa o link da igreja pelo celular e clica em \"Adicionar à Tela de Início\". Funciona tanto em iPhones (iOS) quanto Androids sem precisar de downloads pesados."
          }
        },
        {
          "@type": "Question",
          "name": "Minha igreja tem várias filiais. Como funciona?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Faith Hub foi desenhado desde o início para operações multi-campi. Cada filial tem seus dados, pastores e cantinas isoladas, enquanto a liderança geral da Sede acompanha tudo de forma consolidada."
          }
        },
        {
          "@type": "Question",
          "name": "A Bíblia Sagrada funciona sem internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Todos os 66 livros bíblicos e 1.189 capítulos (traduções NVI, ACF e AA) ficam salvos no cache do dispositivo, permitindo leitura rápida e marcação de versículos em qualquer lugar."
          }
        },
        {
          "@type": "Question",
          "name": "Como a liderança gerencia os grupos e células?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pelo Cell Workspace Studio, os líderes e pastores aprovam novos membros que solicitaram ingresso pelo app, gerenciam contatos e organizam a escala de voluntários para a comunhão semanal."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona a segurança dos dados financeiros e de crianças?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada congregação opera com dados estritamente segregados (multi-tenant nativo). As transações PIX geram comprovantes diretos com conciliação bancária rastreável. No ministério infantil, o check-in exige PIN de segurança de 4 dígitos, crachás digitais e alertas instantâneos, com auditoria completa de operadores e horários de entrada e saída."
          }
        },
        {
          "@type": "Question",
          "name": "Minha igreja é pequena. Faz sentido pra mim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Com certeza. O plano de Entrada foi desenhado exatamente para congregações em fase de estruturação: você começa com o PWA completo para membros, devocionais e dízimos por PIX sem complicação técnica e escala conforme a comunidade crescer."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
